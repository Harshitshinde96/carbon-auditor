services:
  - type: web
    name: ocr-service
    plan: free
    env: python
    buildCommand: "./build.sh"
    startCommand: "./start.sh"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: MAX_FILE_SIZE
        value: 20971520
      - key: ENVIRONMENT
        value: production
